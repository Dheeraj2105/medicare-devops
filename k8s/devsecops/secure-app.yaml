# MediCare+ hardened deployment (Task 9 - DevSecOps)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: medicare-sa
  namespace: medicare-secure
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: medicare-least-privilege
  namespace: medicare-secure
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: medicare-least-privilege
  namespace: medicare-secure
subjects:
  - kind: ServiceAccount
    name: medicare-sa
    namespace: medicare-secure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: medicare-least-privilege
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medicare-data
  namespace: medicare-secure
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicare-secure
  namespace: medicare-secure
  labels:
    app: medicare-secure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medicare-secure
  template:
    metadata:
      labels:
        app: medicare-secure
    spec:
      serviceAccountName: medicare-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: medicare
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "VERSION_PLACEHOLDER"
            - name: APP_COLOR
              value: "secure"
            - name: DB_PATH
              value: /data/medicare.db
          envFrom:
            - secretRef:
                name: medicare-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: medicare-data
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: medicare-secure
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-only
  namespace: medicare-secure
spec:
  podSelector:
    matchLabels:
      app: medicare-secure
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 5000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: v1
kind: Service
metadata:
  name: medicare-secure
  namespace: medicare-secure
spec:
  type: NodePort
  selector:
    app: medicare-secure
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30100
